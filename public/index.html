<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiApp Ride</title>
  
  <!-- 1. Estilos del mapa (Leaflet CSS) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- 2. Fuente moderna (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 3. Iconos (Lucide Icons) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- 4. Tus estilos CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenedor del Mapa (Ocupa el 100% de la pantalla de fondo) -->
  <div id="map"></div>

  <!-- Barra Superior Flotante -->
  <header class="top-bar">
    <button class="btn-icon"><i data-lucide="menu"></i></button>
    <div class="logo">GO<span>ride</span></div>
    <div class="user-avatar">
      <button class="btn-icon"><i data-lucide="user"></i></button>
    </div>
  </header>

  <!-- Tarjeta Inferior de Reserva (Panel flotante tipo Uber/DiDi) -->
  <main class="booking-card">
    <div class="drag-handle"></div>
    
    <h2>¿A dónde vamos hoy?</h2>

    <!-- Inputs de Origen y Destino -->
    <div class="route-inputs">
      <div class="input-group">
        <span class="dot origin"></span>
        <input type="text" placeholder="Ubicación actual" value="Mi ubicación actual">
      </div>
      <div class="input-line"></div>
      <div class="input-group">
        <span class="dot destination"></span>
        <input type="text" placeholder="¿Hacia dónde vas?">
      </div>
    </div>

    <!-- Selección de Vehículos -->
    <div class="ride-options">
      <div class="ride-option active">
        <div class="ride-info">
          <h4>GO Express</h4>
          <p>Llegada en 3 min</p>
        </div>
        <div class="ride-price">$1.200</div>
      </div>

      <div class="ride-option">
        <div class="ride-info">
          <h4>GO Comfort</h4>
          <p>Autos más amplios</p>
        </div>
        <div class="ride-price">$1.650</div>
      </div>
    </div>

    <!-- Botón Principal de Acción -->
    <button class="btn-primary">Confirmar Viaje</button>
  </main>

  <!-- 5. Script del Mapa (Leaflet JS debe ir antes de main.js) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- 6. Tu JavaScript principal -->
  <script src="main.js"></script>
</body>
</html>
